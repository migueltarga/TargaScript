name: Test

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Run examples
        run: |
          go build -o targascript ./cmd/targascript
          for f in examples/*.tg; do
            # constants.tg ends with an intentional error
            [ "$f" = "examples/constants.tg" ] && continue
            echo "== $f"
            ./targascript "$f" > /dev/null
          done

      - name: Run the TargaScript tests
        run: ./targascript test tests

      - name: Check the tour, the tests and the benchmarks
        # Files using the browser's js object are left out
        run: ./targascript check tests bench playground/tour playground/welcome.tg

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: "0.39.0"

      - name: Build WebAssembly
        run: |
          ./web/build.sh build
          ls -l build

      - name: Keep the WebAssembly small
        # A change that pulls in a big Go package shows up here; raise the
        # limit on purpose, or find a smaller way
        run: |
          size=$(wc -c < build/targascript.wasm)
          gzipped=$(gzip -9 -c build/targascript.wasm | wc -c)
          echo "targascript.wasm: $size bytes, $gzipped gzipped"
          if [ "$size" -gt 512000 ]; then
            echo "targascript.wasm is over 500 KB"
            exit 1
          fi

      - name: Compare examples with the CLI
        run: |
          go build -o targascript ./cmd/targascript
          for f in examples/*.tg; do
            # These use random numbers, the clock or load, which differ in the browser
            case "$f" in examples/math_string_time.tg|examples/word_stats.tg) continue ;; esac
            echo "== $f"
            diff <(./targascript "$f" 2>/dev/null) <(node web/run-node.js build/targascript.wasm "$f" 2>/dev/null)
          done
